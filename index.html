<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Apple of Fortune</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Cairo", sans-serif;
        }

        body {
            background-color: #03130d;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .screen-container {
            width: 100vw;
            max-width: 420px;
            height: 100vh;
            max-height: 900px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            background: 
                radial-gradient(circle at 75% 25%, rgba(68, 140, 93, 0.3) 0%, transparent 45%),
                radial-gradient(circle at 20% 80%, rgba(20, 90, 55, 0.35) 0%, transparent 50%),
                linear-gradient(180deg, #0b2d20 0%, #061c14 45%, #020f09 100%);
            box-shadow: 0 0 35px rgba(0, 0, 0, 0.95);
            overflow: hidden;
        }

        /* الشريط العلوي */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 16px 2px 16px;
            z-index: 10;
        }

        .icon-btn {
            background: none;
            border: none;
            color: #d1eae0;
            font-size: 20px;
            cursor: pointer;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .wallet-pill {
            background: rgba(8, 38, 26, 0.85);
            border: 1px solid rgba(46, 204, 113, 0.3);
            border-radius: 20px;
            display: flex;
            align-items: center;
            padding: 3px 14px 3px 6px;
            gap: 10px;
        }

        .wallet-amount {
            color: #ffffff;
            font-size: 15px;
            font-weight: 700;
        }

        .add-cash-btn {
            background: #27ae60;
            color: #fff;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 17px;
            border: none;
            cursor: pointer;
        }

        .title-header {
            text-align: center;
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 2px;
            color: #8be5be;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
            margin-bottom: 2px;
        }

        /* لوحة اللعبة */
        .board {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-evenly;
            padding: 2px 12px;
            gap: 2px;
            z-index: 5;
            position: relative;
        }

        .grid-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
            transition: all 0.25s ease;
            position: relative;
        }

        .mult-tag {
            width: 50px;
            height: 20px;
            background: rgba(10, 30, 20, 0.7);
            border-radius: 10px;
            font-size: 10.5px;
            font-weight: 700;
            color: #6da38b;
            display: flex;
            align-items: center;
            justify-content: center;
            direction: ltr;
        }

        .grid-row.active-row .mult-tag {
            background: #68bd45;
            color: #ffffff;
            box-shadow: 0 0 10px rgba(104, 189, 69, 0.7);
        }

        /* الأطباق الخشبية الأصلية */
        .plate {
            flex: 1;
            max-width: 52px;
            aspect-ratio: 1;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, #a45a2a 0%, #633211 60%, #3a1a05 100%);
            border: 1.5px solid #84451a;
            box-shadow: inset 0 2px 3px rgba(255, 255, 255, 0.25), 0 4px 8px rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            transition: transform 0.15s;
        }

        .plate.dim {
            filter: brightness(0.65) saturate(0.8);
            opacity: 0.65;
        }

        .grid-row.active-row .plate {
            filter: brightness(1) saturate(1.1);
            opacity: 1;
        }

        .grid-row.active-row .plate:active {
            transform: scale(0.92);
        }

        /* الغطاء المقبب في الدور النشط */
        .plate-cover {
            width: 80%;
            height: 80%;
            background: radial-gradient(circle at 50% 30%, #f78d38 0%, #d85c07 70%, #9c3c00 100%);
            border-radius: 50% 50% 38% 38%;
            border: 1.5px solid #5a2000;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 2px 2px rgba(255,255,255,0.4), 0 2px 4px rgba(0,0,0,0.5);
            animation: pulseGlow 1.3s infinite alternate ease-in-out;
        }

        .plate-cover::after {
            content: '';
            position: absolute;
            bottom: 20%;
            width: 72%;
            height: 4px;
            background: #2fe1cf;
            border-radius: 2px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.6);
        }

        @keyframes pulseGlow {
            0% { filter: drop-shadow(0 0 2px rgba(255, 170, 0, 0.3)); }
            100% { filter: drop-shadow(0 0 7px rgba(255, 200, 0, 0.8)); }
        }

        /* خلفيات الأطباق عند كشف النتائج */
        .plate.win-bg {
            background: radial-gradient(circle at 45% 40%, #15733f 0%, #0d4626 70%, #052312 100%) !important;
            border-color: #27ae60 !important;
            box-shadow: inset 0 0 6px #2ecc71, 0 3px 6px rgba(0,0,0,0.7) !important;
        }

        .plate.lose-bg {
            background: radial-gradient(circle at 45% 40%, #7d1c16 0%, #4a0d09 70%, #240503 100%) !important;
            border-color: #c0392b !important;
            box-shadow: inset 0 0 6px #e74c3c, 0 3px 6px rgba(0,0,0,0.7) !important;
        }

        /* تصميم التفاح الواقعي SVG */
        .svg-icon {
            width: 75%;
            height: 75%;
            animation: popIn 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            0% { transform: scale(0.3); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* لوحة التحكم والرهان */
        .control-panel {
            background: #091712;
            border-top: 1px solid #163628;
            padding: 8px 14px 14px 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 10;
        }

        .quick-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
        }

        .quick-btn {
            background: #5292c6;
            border: none;
            color: #ffffff;
            border-radius: 6px;
            padding: 7px 0;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
        }

        .input-action-bar {
            display: flex;
            background: #1f3747;
            border: 1px solid #2a4c62;
            border-radius: 8px;
            padding: 4px;
            align-items: center;
            justify-content: space-between;
        }

        .bet-trigger-btn {
            background: #549ad6;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            padding: 12px 26px;
            font-size: 15.5px;
            font-weight: 800;
            cursor: pointer;
            min-width: 110px;
        }

        .bet-trigger-btn.cashout-mode {
            background: #27ae60;
        }

        .bet-value-container {
            display: flex;
            align-items: center;
            gap: 4px;
            padding-left: 12px;
        }

            background: transparent;
            border: none;
            color: #fff;
            font-size:
